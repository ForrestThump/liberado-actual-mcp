name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# CI compiles untrusted dependencies. It never needs repository write access.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format check
        run: cargo fmt --check --all

  clippy:
    name: cargo clippy (host)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Clippy (host crate)
        run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    needs: [fmt, clippy]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain (from rust-toolchain.toml)
        run: |
          rustup show
          rustc --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Host tests
        run: cargo test --locked --no-fail-fast

  docker-image:
    name: docker build (slim)
    # Automatic on master; PR images need an explicit maintainer label.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'docker-image')
    needs: [fmt, clippy, test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build slim image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: liberado-actual-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          set -euo pipefail
          cid="$(docker run -d -p 8000:8000 liberado-actual-mcp:ci)"
          trap 'docker rm -f "${cid}" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs "${cid}"
          exit 1